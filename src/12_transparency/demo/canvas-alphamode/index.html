<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 canvas-alphamode — WebGPU — 透明度</title>
    <link rel="stylesheet" href="/style.css">
    <style>
    #webgpu-canvas {
      background-color: #404040;
      background-image:
        linear-gradient(45deg, #808080 25%, transparent 25%),
        linear-gradient(-45deg, #808080 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #808080 75%),
        linear-gradient(-45deg, transparent 75%, #808080 75%);
      background-size: 32px 32px;
      background-position:
        0 0,
        0 16px,
        16px -16px,
        -16px 0;
    }
    </style>
  </head>
  <body>
    <a
      href="/"
      class="fixed left-2 top-2 z-10 rounded-md bg-black/55 px-2.5 py-1 text-sm text-white no-underline hover:bg-black/70"
      >← 一覧</a
    >
    <canvas id="webgpu-canvas" class="fixed inset-0 h-dvh w-full"></canvas>
    <script type="module" src="./scripts/index.ts"></script>
  </body>
</html>
